steps:
  # 1. Build Docker image for the backend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/terrasync-backend:$COMMIT_SHA', './backend']

  # 2. Push image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/terrasync-backend:$COMMIT_SHA']

  # 3. Deploy container image to Google Cloud Run (Serverless)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'terrasync-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/terrasync-backend:$COMMIT_SHA'
      - '--region'
      - 'asia-south1' # Mumbai / India GCP Region
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--timeout'
      - '60s'
      - '--concurrency'
      - '80'
      - '--set-env-vars'
      - 'NODE_ENV=production'

images:
  - 'gcr.io/$PROJECT_ID/terrasync-backend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
